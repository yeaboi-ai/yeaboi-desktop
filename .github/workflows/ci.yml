# CI for yeaboi-desktop — the duck-branded planning app (Electron shell over
# the planning-platform FastAPI backend).
#
# Nothing here launches Electron, so nothing here downloads it: the binary is a
# ~100MB fetch and typecheck, vitest and the build gate all run without it.
# The signed three-OS pack belongs to release.yml, not to PR CI.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  gate:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `lint` is `typecheck`. There is no ESLint in this tree and never was;
      # with strict TypeScript on, `tsc --noEmit` is what actually rejects code.
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  build:
    name: The renderer builds clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # `build-check` turns an unresolved asset reference (a warning the build
      # survives with exit 0) into a red job.
      - run: npm run build:check

  backend:
    name: The vendored backend's tests
    runs-on: ubuntu-latest
    # ~8 minutes of suite plus the voice extra's install on a cold cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The migration guard diffs against the base branch, which a shallow
          # clone cannot reach.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      # The suite had failures before it had a job here, so this compares the
      # failing set against backend/tests/known-failures.txt rather than
      # requiring green — both ways, so the list cannot quietly rot. The two
      # migrations that remove projects are the reason this job exists: they
      # run unattended inside every installed app's startup, and nothing else
      # in CI touches them.
      - run: ./scripts/check-tests.sh
        working-directory: backend
      - run: uv run ruff check src tests
        working-directory: backend
        continue-on-error: true
      # Only the migrations this branch touches: history predates the policy.
      - run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref || 'main' }}"
          git diff --name-only FETCH_HEAD...HEAD -- 'backend/alembic/versions/*.py' \
            | sed 's|^backend/||' > /tmp/changed-migrations
          if [ -s /tmp/changed-migrations ]; then
            cd backend && xargs ./scripts/check-sqlite-safe-migrations.sh < /tmp/changed-migrations
          else
            echo "no migrations changed"
          fi

  tooling:
    name: The shared tooling pin is honoured
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `make tooling-check` clones .tooling/ at the pinned sha, asserts the
      # checkout matches it, and asserts this repo still defines every target
      # the devkit plugin calls. This job exists because none of that was true
      # for a while: a renderer migration deleted .tooling-rev, scripts/
      # tooling-sync.sh and the Makefile's include in one commit, and nothing
      # was red afterwards.
      - run: make tooling-check

  manifest:
    name: Renderer routes match the manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      # The parity seam: contracts/v1/routes_manifest.json is code-generated
      # from src/renderer/lib/yeaboi/routes.json, and yeaboi.ai's
      # surface-parity suite reads its committed copy to decide whether a
      # capability reached the desktop. This fails when the committed manifest
      # is stale — regenerate with `npm run gen-manifest` and commit.
      - run: node scripts/gen-routes-manifest.mjs --check
