name: release

# Build, sign, notarize and publish the Electron app.
#
# This lane does NOT ride the Python release. The yeaboi repo puts a wheel on
# PyPI; this workflow takes a wheel that is ALREADY there and wraps it in an
# application. The version is therefore an input, never something derived from
# the tree — this repo has no version line of its own: a desktop build has to be
# reproducible from a released artifact, and a rebuild of yesterday's app must
# bundle yesterday's yeaboi.
#
# The pinned version must be a final. An rc reaches PyPI on every version-moving
# push to main, and shipping one inside a signed installer would put unreviewed
# code on someone's machine with a notarized ticket vouching for it.
#
# Secrets:
#   RELEASES_REPO_TOKEN                               — REQUIRED; see below
#   CSC_LINK / CSC_KEY_PASSWORD                       — the Apple Developer ID cert
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID  — notarization
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET — Windows signing
#
# A missing signing secret does NOT fail electron-builder: it logs "skipped macOS
# notarization" and carries on. The `Assess the signed app` step below is the only
# thing that catches it, which is also why the release stays a draft until it passes.
#
# The installers go to yeaboi-ai/yeaboi-desktop-releases, a public repo, because this
# one is private and can host nothing anybody can download. The default GITHUB_TOKEN
# cannot write to another repository, so RELEASES_REPO_TOKEN is a PAT scoped to it.

on:
  workflow_dispatch:
    inputs:
      yeaboi_version:
        description: 'the released yeaboi X.Y.Z to bundle (must exist on PyPI)'
        required: true
      platforms:
        description: 'which OS legs to build'
        required: false
        default: mac
        type: choice
        options: [mac, all]

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.yeaboi_version }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve the release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pick.outputs.version }}
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: pick
        # Checked against PyPI before two runners spend forty minutes discovering
        # the wheel does not exist.
        env:
          VERSION: ${{ inputs.yeaboi_version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' is not a final X.Y.Z — the desktop never ships a pre-release"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/yeaboi/$version/json")
          if [ "$code" != "200" ]; then
            echo "::error::yeaboi $version is not on PyPI (HTTP $code) — release it first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundling yeaboi $version"

      - id: legs
        # All four legs live here, always: a macOS-first launch must not delete the
        # lanes it is not shipping yet. The matrix is built here because a job-level
        # `if:` cannot see the matrix context — it is evaluated before expansion.
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          all='[
            {"os":"macos-14","name":"macOS (arm64)","arch":"arm64","flag":"mac"},
            {"os":"macos-15-intel","name":"macOS (x64)","arch":"x64","flag":"mac"},
            {"os":"windows-latest","name":"Windows (x64)","arch":"x64","flag":"win"},
            {"os":"ubuntu-latest","name":"Linux (x64)","arch":"x64","flag":"linux"}
          ]'
          if [ "$PLATFORMS" = "all" ]; then
            include=$(printf '%s' "$all" | jq -c .)
          else
            include=$(printf '%s' "$all" | jq -c '[.[] | select(.flag == "mac")]')
          fi
          printf 'matrix={"include":%s}\n' "$include" >> "$GITHUB_OUTPUT"
          printf '%s' "$include" | jq -r '.[] | "building " + .name'

      # electron-builder creates the release from whichever upload arrives first,
      # and its uploads run concurrently: PublishManager.getOrCreatePublisher is
      # async and does check-then-set across an await, so two artifact events both
      # find no publisher, each builds one with its own Lazy, and each calls
      # getOrCreateRelease. GitHub accepts both — a draft has no tag to collide on
      # — and the assets end up split across two drafts. max-parallel does not help;
      # the race is inside one leg. Creating the draft once, here, is what makes it
      # impossible: every publisher then finds this one.
      - name: Create the one draft the legs publish into
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          repo=yeaboi-ai/yeaboi-desktop-releases
          releases=$(gh api "repos/$repo/releases" --paginate)

          # Re-releasing over a published version would silently rewrite what the
          # website already links to.
          if printf '%s' "$releases" | jq -e --arg t "v$VERSION" \
               'any(.[]; .tag_name == $t and .draft == false)' >/dev/null; then
            echo "::error::v$VERSION is already published — bump the version"
            exit 1
          fi

          # Drafts left by an earlier attempt, including any duplicate pair.
          for id in $(printf '%s' "$releases" | jq -r --arg t "v$VERSION" \
                        '.[] | select(.tag_name == $t) | .id'); do
            echo "removing stale draft $id"
            gh api -X DELETE "repos/$repo/releases/$id"
          done

          gh release create "v$VERSION" --repo "$repo" --draft \
            --title "$VERSION" --notes "yeaboi.ai $VERSION"
          echo "draft v$VERSION ready"

  build:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # the release goes to another repo, through RELEASES_REPO_TOKEN
    strategy:
      fail-fast: false
      # One at a time. Both mac legs call electron-builder's getOrCreateRelease and
      # both write latest-mac.yml; run in parallel they make two drafts, and the
      # second upload replaces the first arch's update metadata rather than merging.
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: npm ci

      # The app carries the same version as the yeaboi it bundles. One number
      # for a person to say out loud, and the auto-updater compares it.
      - name: Stamp the app version
        run: npm version "${{ needs.resolve.outputs.version }}" --no-git-tag-version --allow-same-version

      # The two Pythons and the LiveKit server the packaged app spawns from
      # process.resourcesPath. A missing extraResources source is only a WARNING in
      # electron-builder, so --check is the gate: without it a build that staged
      # nothing is green, signed, notarized, published — and cannot start.
      #
      # `shell: bash` is deliberate. On Windows the default is pwsh, which reports
      # only the last command's exit code in a multi-line run, masking a failure here.
      - name: Stage the bundled runtimes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-runtimes.mjs --version "${{ needs.resolve.outputs.version }}" \
            --planning --arch ${{ matrix.arch }}
          node scripts/fetch-runtimes.mjs --check --planning \
            --version "${{ needs.resolve.outputs.version }}" --arch ${{ matrix.arch }}

      # LiveKit publishes no darwin release asset — macOS is Homebrew or a source
      # build — so the mac legs take brew's binary and fetch-livekit.mjs stages it
      # from PATH. The other platforms download and verify against checksums.txt.
      - name: Install livekit-server (macOS has no upstream binary)
        if: runner.os == 'macOS'
        run: brew install livekit

      - name: Stage the LiveKit server
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-livekit.mjs --arch ${{ matrix.arch }}
          node scripts/fetch-livekit.mjs --check --arch ${{ matrix.arch }}

      - name: Build the renderer and main bundles
        run: npm run build

      - name: Build, sign and publish
        env:
          # Not GITHUB_TOKEN: the release lands in another repository, which the
          # default token has no write access to.
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # An absent secret expands to the empty string, and GitHub still puts the
          # key in the environment. electron-builder reads CSC_LINK with a
          # chooseNotNull whose own comment says "allow to specify as empty string",
          # so "" wins over unset and it resolves the cert against the project dir —
          # "<projectDir> not a file". Unsetting is the only way to say "no cert".
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD \
                   APPLE_TEAM_ID AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            [ -n "${!v:-}" ] || unset "$v"
          done
          npx electron-builder --${{ matrix.flag }} --${{ matrix.arch }} --publish always

      # Gatekeeper's own opinion of what was just built. Notarization can report
      # success and still leave an app macOS refuses to open, and the only place
      # that shows up otherwise is a user's Downloads folder.
      - name: Assess the signed app
        if: runner.os == 'macOS'
        env:
          # Whether a certificate existed, not the certificate — a `!= ''` on a
          # secret evaluates to a plain boolean and leaks nothing.
          SIGNED: ${{ secrets.CSC_LINK != '' }}
        run: |
          set -euo pipefail
          # By glob, not by name: the bundle is named from productName and
          # a rename must not quietly turn this step into a no-op.
          app=$(find dist -maxdepth 3 -name '*.app' | head -1)
          test -n "$app" || { echo "::error::no .app in dist"; exit 1; }
          if [ "$SIGNED" != "true" ]; then
            # A credential-free rehearsal, whose job is to prove staging and the
            # cross-repo publish. Gatekeeper will refuse an ad-hoc signature, so
            # asserting it here would make the rehearsal permanently red and skip
            # every job downstream of it. The release stays a draft regardless.
            echo "::warning::no CSC_LINK — checked that $app exists, not that Gatekeeper accepts it"
            exit 0
          fi
          echo "assessing $app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --deep --strict --verbose=2 "$app"

      - uses: actions/upload-artifact@v5
        if: always() # the merge job needs each leg's latest-mac.yml even so
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
          if-no-files-found: error

  # The two mac legs each wrote a latest-mac.yml listing only their own arch, and
  # the second upload replaced the first — electron-builder merges architectures
  # within one invocation, and these are two. Left unmerged, an Intel install has
  # no update candidate at all and an arm64 install takes the Intel build.
  update-metadata:
    name: Merge the update metadata
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v5
        with: { path: legs }

      - name: Merge and re-upload
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/merge-mac-update-info.mjs legs dist/latest-mac.yml
          gh release upload "v$VERSION" dist/latest-mac.yml \
            --repo yeaboi-ai/yeaboi-desktop-releases --clobber

      # A skipped upload is a warning in electron-publish, not a failure, so the
      # release is asserted rather than assumed.
      - name: What the release actually holds
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          repo=yeaboi-ai/yeaboi-desktop-releases

          # `gh release view` resolves a tag to one release and duplicates are
          # legal for drafts, so it would happily report on whichever it picked.
          n=$(gh api "repos/$repo/releases" --paginate \
                | jq --arg t "v$VERSION" '[.[] | select(.tag_name == $t)] | length')
          [ "$n" = "1" ] || { echo "::error::$n releases tagged v$VERSION, expected 1"; exit 1; }

          gh release view "v$VERSION" --repo "$repo" \
            --json assets --jq '.assets[].name' | sort | tee assets.txt
          for want in yeaboi.ai-arm64.dmg yeaboi.ai-x64.dmg latest-mac.yml; do
            grep -qx "$want" assets.txt || { echo "::error::$want is missing"; exit 1; }
          done
          echo "publish it with: gh release edit v$VERSION --repo yeaboi-ai/yeaboi-desktop-releases --draft=false"
