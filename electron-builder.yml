# How the shell becomes an installable, signed, notarized application. The packaged
# app is self-contained: two python-build-standalone runtimes and a livekit-server
# ship as extraResources and are spawned from process.resourcesPath. Only a dev run
# reaches for a backend it did not bring.

appId: ai.yeaboi.desktop
# productName is not repeated here: electron-builder reads it from
# package.json, which is also where an unpackaged run gets app.getName().
copyright: Copyright © yeaboi.ai

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - resources/**
  # The staged runtimes ship as extraResources, outside asar — keep the
  # globs above from double-packing them.
  - '!resources/py/**'
  - '!resources/py-planning/**'
  - '!resources/livekit/**'
  - package.json

# The two Python backends and the LiveKit server, staged by
# scripts/fetch-runtimes.mjs and scripts/fetch-livekit.mjs. sidecar.ts,
# planning.ts and livekit.ts resolve them under process.resourcesPath.
extraResources:
  - from: resources/py
    to: py
    filter: ['**/*', '!**/__pycache__/**']
  - from: resources/py-planning
    to: py-planning
    filter: ['**/*', '!**/__pycache__/**']
  - from: resources/livekit
    to: livekit

# No native modules — skipping the rebuild saves a toolchain on every runner.
npmRebuild: false
asar: true

# electron-updater asks this repository what the latest version is, so it must
# be the repository the release workflow publishes into — an installed app
# pointed at the wrong one updates itself to nothing, silently, forever.
# yeaboi-desktop is private and can host no installers anybody can download, so the
# builds go to a public releases-only repo. This block is also written verbatim into
# the packaged app-update.yml, which is what electron-updater polls: the publish
# target and the update feed are one decision, and pointed apart an installed app
# updates itself to nothing, silently, forever.
#
# draft, deliberately: --publish always uploads before the Gatekeeper assessment runs
# and before the second arch exists. A draft is invisible until `gh release edit
# --draft=false`, which is one command once both legs are green.
publish:
  provider: github
  owner: yeaboi-ai
  repo: yeaboi-desktop-releases
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # No ${version} in the name. yeaboi.ai links these as
  # /releases/latest/download/<asset>, which GitHub resolves only while the asset
  # name is identical across releases — a versioned name 404s every download link
  # on the site the day the next release ships. The arch is mandatory for the
  # opposite reason: the default drops the suffix on x64, leaving a bare
  # "yeaboi.ai.dmg" that reads like the one everybody should take.
  artifactName: '${productName}-${arch}.${ext}'
  # The app is English-only; Electron's other 50-odd .lproj bundles are ~40 MB
  # of resources nothing reads.
  electronLanguages: [en, en-US]
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # electron-updater needs the zip; the dmg is what people click
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    # The duck climbs the Dock by asking the Dock where its icons are.
    NSAppleEventsUsageDescription: yeaboi asks the Dock for its position so the desktop duck can perch on it.
    NSMicrophoneUsageDescription: yeaboi uses the microphone for voice calls in planning sessions and for on-device dictation.
    NSCameraUsageDescription: yeaboi uses the camera for video tiles in planning-session calls.

dmg:
  background: build/dmg-background.png
  window: { width: 540, height: 380 }
  # DMG_ICON_Y in scripts/gen_desktop_icons.py draws the arrow on this line.
  contents:
    - { x: 150, y: 190, type: file }
    - { x: 390, y: 190, type: link, path: /Applications }

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Azure Trusted Signing. The credentials arrive as environment variables
  # (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET); an unsigned
  # local build simply has none of them set and skips this.
  azureSignOptions:
    publisherName: yeaboi
    endpoint: https://weu.codesigning.azure.net
    certificateProfileName: yeaboi
    codeSigningAccountName: yeaboi

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: yeaboi.ai

linux:
  icon: build/icons
  category: Development
  synopsis: AI Scrum Master, and a watcher of AI coding agents
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
