# How the shell becomes an installable, signed application. There is no
# bundled backend any more — the app is a pure client of the planning
# platform's FastAPI (localhost in dev; packaging a backend is future work).

appId: ai.yeaboi.desktop
productName: yeaboi
copyright: Copyright © yeaboi

directories:
  output: dist
  buildResources: build

files:
  - out/**
  - resources/**
  # The staged runtimes ship as extraResources, outside asar — keep the
  # globs above from double-packing them.
  - '!resources/py/**'
  - '!resources/py-planning/**'
  - '!resources/livekit/**'
  - package.json

# The two Python backends and the LiveKit server, staged by
# scripts/fetch-runtimes.mjs and scripts/fetch-livekit.mjs. sidecar.ts,
# planning.ts and livekit.ts resolve them under process.resourcesPath.
extraResources:
  - from: resources/py
    to: py
    filter: ['**/*', '!**/__pycache__/**']
  - from: resources/py-planning
    to: py-planning
    filter: ['**/*', '!**/__pycache__/**']
  - from: resources/livekit
    to: livekit

# No native modules — skipping the rebuild saves a toolchain on every runner.
npmRebuild: false
asar: true

# electron-updater asks this repository what the latest version is, so it must
# be the repository the release workflow publishes into — an installed app
# pointed at the wrong one updates itself to nothing, silently, forever.
publish:
  provider: github
  owner: yeaboi-ai
  repo: yeaboi-desktop
  releaseType: draft

mac:
  category: public.app-category.developer-tools
  # The app is English-only; Electron's other 50-odd .lproj bundles are ~40 MB
  # of resources nothing reads.
  electronLanguages: [en, en-US]
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip # electron-updater needs the zip; the dmg is what people click
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  extendInfo:
    # The duck climbs the Dock by asking the Dock where its icons are.
    NSAppleEventsUsageDescription: yeaboi asks the Dock for its position so the desktop duck can perch on it.
    NSMicrophoneUsageDescription: yeaboi uses the microphone for voice calls in planning sessions and for on-device dictation.
    NSCameraUsageDescription: yeaboi uses the camera for video tiles in planning-session calls.

dmg:
  background: build/dmg-background.png
  window: { width: 540, height: 380 }
  # DMG_ICON_Y in scripts/gen_desktop_icons.py draws the arrow on this line.
  contents:
    - { x: 150, y: 190, type: file }
    - { x: 390, y: 190, type: link, path: /Applications }

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Azure Trusted Signing. The credentials arrive as environment variables
  # (AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET); an unsigned
  # local build simply has none of them set and skips this.
  azureSignOptions:
    publisherName: yeaboi
    endpoint: https://weu.codesigning.azure.net
    certificateProfileName: yeaboi
    codeSigningAccountName: yeaboi

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  shortcutName: yeaboi

linux:
  icon: build/icons
  category: Development
  synopsis: AI Scrum Master, and a watcher of AI coding agents
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
